<nav class="side-menu" aria-label="Store navigation">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">🏠 Home</a>
  @if ((isAuthenticated$ | async) && (currentRole$ | async) === 'CUSTOMER') {
    <a routerLink="/categories" routerLinkActive="active">🗂️ Categories</a>
  }

  @if ((isAuthenticated$ | async) && (currentRole$ | async) === 'ADMIN') {
    <a routerLink="/admin/dashboard" routerLinkActive="active">📊 Dashboard</a>
    <a routerLink="/admin/categories" routerLinkActive="active">🗂️ Categories</a>
    <a routerLink="/admin/brands" routerLinkActive="active">🏷️ Brands</a>
    <a routerLink="/admin/products" routerLinkActive="active">📦 Products</a>
    <a routerLink="/admin/orders" routerLinkActive="active">🧾 Orders</a>
    <!-- <a routerLink="/admin/inventory" routerLinkActive="active">🏷️ Inventory</a> -->
    <a routerLink="/admin/shipping" routerLinkActive="active">🚚 Shipping</a>
  }
</nav>
