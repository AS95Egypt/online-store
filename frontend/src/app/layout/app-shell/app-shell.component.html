<header class="topbar" [class.scrolled]="isScrolled()">
  <div class="brand-wrap">
    <a routerLink="/" class="brand">⚡Home Tech</a>
  </div>

  @if (isHomePage()) {
    <form class="search-form" role="search" (ngSubmit)="submitSearch()">
      <label class="visually-hidden" for="catalog-search">Search products</label>
      <input
        id="catalog-search"
        type="search"
        name="search"
        placeholder="Search products by name…"
        autocomplete="off"
        [(ngModel)]="searchTerm"
      />
      @if (searchTerm) {
        <button type="button" class="clear-search" aria-label="Clear search" (click)="clearSearch()">
          ×
        </button>
      }
      <button type="submit" class="search-button">Search</button>
    </form>
  }

  <nav class="nav" aria-label="Main navigation">
    <app-side-menu />
    @if ((currentRole$ | async) !== 'ADMIN') {
      <a class="cart-link" routerLink="/cart" aria-label="Shopping cart">
        <span aria-hidden="true">🛒</span>
        <span>Cart</span>
        @if (cartService.itemCount(); as count) {
          <span class="cart-badge" [attr.aria-label]="count + ' items in cart'">{{ count }}</span>
        }
        </a>
    }
    <app-account-menu />
  </nav>
</header>

<main class="page-shell">
  <router-outlet></router-outlet>
</main>

@if (notificationService.message(); as message) {
  <div class="toast" role="status">
    <span>{{ message }}</span>
    <button type="button" aria-label="Dismiss notification" (click)="dismissNotification()">×</button>
  </div>
}
