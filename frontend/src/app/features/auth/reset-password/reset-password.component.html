<section class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">Secure access</p>
    <h1>Set a new password</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>New password</span>
        <input type="password" formControlName="newPassword" placeholder="At least 8 characters" />
      </label>

      <label>
        <span>Confirm password</span>
        <input type="password" formControlName="confirmPassword" placeholder="Repeat your password" />
      </label>

      @if (form.hasError('passwordMismatch') && form.touched) {
        <p class="inline-error">Passwords do not match.</p>
      }

      <button type="submit" class="primary-button">Reset password</button>
    </form>
  </div>
</section>

<dialog #errorDialog class="error-dialog" aria-labelledby="reset-password-error-title">
  <div class="error-dialog__content">
    <h2 id="reset-password-error-title">Unable to reset password</h2>
    <p role="alert">{{ serverError }}</p>
    <button type="button" class="primary-button" (click)="closeErrorDialog()">Close</button>
  </div>
</dialog>
